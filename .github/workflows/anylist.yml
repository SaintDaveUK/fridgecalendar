name: Sync AnyList todos
# GitHub heavily throttles scheduled runs (often hours apart), so one run loops for ~55 minutes
# syncing every 3 minutes, then re-dispatches itself. The cron is only a fallback to restart the chain.
on:
  schedule: [{ cron: '4,34 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: anylist-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix relay --no-audit --no-fund
      - name: Sync loop
        env:
          ANYLIST_EMAIL: ${{ secrets.ANYLIST_EMAIL }}
          ANYLIST_PASSWORD: ${{ secrets.ANYLIST_PASSWORD }}
          ANYLIST_LISTS: ${{ secrets.ANYLIST_LISTS }}  # optional
          NODE_PATH: relay/node_modules
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 55*60))
          while true; do
            node relay/anylist-sync.js || echo "sync failed, will retry"
            git add todos.json
            if ! git diff --staged --quiet; then
              git commit -m "Sync AnyList todos"
              for i in 1 2 3; do
                git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && break
                sleep 5
              done
              # pushes made with GITHUB_TOKEN don't trigger a Pages build, so request one
              curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
            fi
            [ $SECONDS -ge $end ] && break
            sleep 180
          done
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/anylist.yml/dispatches" \
            -d '{"ref":"${{ github.event.repository.default_branch }}"}' || true
