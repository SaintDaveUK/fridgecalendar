name: Sync AnyList todos
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix relay --no-audit --no-fund
      - run: node relay/anylist-sync.js
        env:
          ANYLIST_EMAIL: ${{ secrets.ANYLIST_EMAIL }}
          ANYLIST_PASSWORD: ${{ secrets.ANYLIST_PASSWORD }}
          ANYLIST_LISTS: ${{ secrets.ANYLIST_LISTS }}  # optional
          NODE_PATH: relay/node_modules
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todos.json
          git diff --staged --quiet || git commit -m "Sync AnyList todos"
          git push origin HEAD:gh-pages
          # pushes made with GITHUB_TOKEN don't trigger a Pages build, so request one
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
