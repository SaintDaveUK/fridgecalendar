# NOTE: scheduled workflows only run from the default branch (main). Copy this file there.
name: Sync AnyList todos
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix relay --no-audit --no-fund
      - run: node relay/anylist-sync.js
        env:
          ANYLIST_EMAIL: ${{ secrets.ANYLIST_EMAIL }}
          ANYLIST_PASSWORD: ${{ secrets.ANYLIST_PASSWORD }}
          ANYLIST_LISTS: ${{ secrets.ANYLIST_LISTS }}  # optional
          NODE_PATH: relay/node_modules
      - name: Commit if changed
        run: |
          # ignore the timestamp-only change
          if git diff --quiet -I'"updated"' todos.json 2>/dev/null && git ls-files --error-unmatch todos.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "anylist-sync"; git config user.email "anylist-sync@users.noreply.github.com"
          git add todos.json
          git commit -m "Sync AnyList todos" && git push
