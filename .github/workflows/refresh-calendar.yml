name: Refresh Calendar Data

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch ICS data
        run: curl -L "${{ secrets.ICS_URL }}" -o calendar.ics --fail --show-error

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add calendar.ics
          git diff --staged --quiet && exit 0
          git commit -m "Refresh calendar data"
          # The AnyList sync also pushes to gh-pages, so rebase and retry if we lose the race.
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
          exit 1
