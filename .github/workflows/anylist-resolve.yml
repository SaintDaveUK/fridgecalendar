name: Resolve AnyList item
# Triggered by the fridge (via the Cloudflare Worker in relay/worker.js) when a post-it is tapped.
on:
  workflow_dispatch:
    inputs:
      list: { description: 'AnyList list name', required: true }
      name: { description: 'Item name', required: true }
permissions:
  contents: write
  pages: write
concurrency:
  group: anylist-resolve
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: gh-pages }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix relay --no-audit --no-fund
      - name: Resolve item and refresh todos.json
        env:
          ANYLIST_EMAIL: ${{ secrets.ANYLIST_EMAIL }}
          ANYLIST_PASSWORD: ${{ secrets.ANYLIST_PASSWORD }}
          ANYLIST_LISTS: ${{ secrets.ANYLIST_LISTS }}
          ITEM_LIST: ${{ inputs.list }}
          ITEM_NAME: ${{ inputs.name }}
          NODE_PATH: relay/node_modules
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node relay/anylist-resolve.js
          node relay/anylist-sync.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todos.json
          if ! git diff --staged --quiet; then
            git commit -m "Resolve AnyList item"
            for i in 1 2 3; do
              git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && break
              sleep 5
            done
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
